services:
  ho:
    build: .
    image: ho:latest
    container_name: ho
    restart: unless-stopped
    # Left port = port on the host, changeable via HOST_PORT. Behind a
    # reverse proxy set HOST_BIND to 127.0.0.1 so only the proxy can reach
    # it and nobody opens the port around the access control.
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    # Accounts survive every new image and live in ./data next to this
    # file - backup = copy the directory. Create ./data yourself first,
    # otherwise Docker creates it as root and node cannot write to it.
    volumes:
      - ./data:/data
    # Sign-in in front of the lobby. Hosted it stays on (default), locally
    # HO_AUTH=off switches it off - most conveniently as a line in a .env
    # next to this file. If the setting is missing, "on" applies: forgetting
    # it means safe.
    environment:
      HO_AUTH: ${HO_AUTH:-on}
    # Otherwise node runs as PID 1 and ignores SIGTERM -> slow shutdown.
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/login.html').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Only on demand: docker compose --profile test run --rm test
  test:
    build: .
    image: ho:latest
    profiles: ["test"]
    command: ["npm", "test"]
