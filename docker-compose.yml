services:
  ho:
    build: .
    image: ho:latest
    container_name: ho
    restart: unless-stopped
    # Linker Port = Port auf dem Host, per HOST_PORT aenderbar.
    ports:
      - "${HOST_PORT:-8080}:8080"
    # Node laeuft sonst als PID 1 und ignoriert SIGTERM -> langsames Stoppen.
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Nur auf Zuruf: docker compose --profile test run --rm test
  test:
    build: .
    image: ho:latest
    profiles: ["test"]
    command: ["npm", "test"]
