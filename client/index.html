<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ho!! – Galactic Expansion</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="img/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/mark.svg">
</head>
<body>

<!-- ============================ Startbildschirm ============================ -->
<div id="screen-menu" class="screen">
  <div class="menu-sky"><canvas id="menu-canvas"></canvas></div>
  <div class="menu-box">
    <h1 class="logo"><img src="img/logo.svg" alt="Ho!!" width="330" height="182"></h1>
    <p class="tagline" data-i18n="menu.tagline"></p>

    <label class="field">
      <span data-i18n="menu.name"></span>
      <input id="in-name" maxlength="18" data-i18n-attr="placeholder:menu.namePlaceholder">
    </label>

    <label class="field" style="margin-bottom:12px">
      <span data-i18n="menu.board"></span>
      <select id="in-mode">
        <option value="classic" data-i18n="menu.board.classic"></option>
        <option value="space" data-i18n="menu.board.space"></option>
      </select>
    </label>

    <label class="field" style="margin-bottom:12px">
      <span data-i18n="menu.shape"></span>
      <select id="in-shape">
        <option value="scatter" data-i18n="menu.shape.scatter"></option>
        <option value="spiral" data-i18n="menu.shape.spiral"></option>
      </select>
    </label>

    <div class="menu-actions">
      <button id="btn-create" class="primary" data-i18n="menu.create"></button>
      <button id="btn-solo" data-i18n="menu.solo"></button>
      <div class="join-row">
        <input id="in-code" maxlength="4" data-i18n-attr="placeholder:menu.codePlaceholder" autocomplete="off">
        <button id="btn-join" data-i18n="menu.join"></button>
      </div>
      <div class="join-row">
        <select id="in-watchbots" data-i18n-attr="title:menu.botCountTitle">
          <option value="4" data-i18n="menu.botCount" data-i18n-args='{"n":4}'></option>
          <option value="6" selected data-i18n="menu.botCount" data-i18n-args='{"n":6}'></option>
          <option value="8" data-i18n="menu.botCount" data-i18n-args='{"n":8}'></option>
          <option value="12" data-i18n="menu.botCount" data-i18n-args='{"n":12}'></option>
          <option value="16" data-i18n="menu.botCount" data-i18n-args='{"n":16}'></option>
        </select>
        <button id="btn-watch" data-i18n="menu.watch"></button>
      </div>
    </div>

    <div id="open-games" class="open-games"></div>
    <div id="menu-error" class="error"></div>
    <p class="hint"><span data-i18n="menu.hint"></span><a href="#" id="link-help" data-i18n="menu.help"></a></p>
    <div class="lang-row"><span class="muted small" data-i18n="menu.language"></span>
      <select id="in-lang" class="lang-pick"></select></div>
    <p id="account-row" class="account-row hidden">
      <span id="account-name"></span>
      <a href="#" id="link-logout" data-i18n="auth.logout"></a>
    </p>
  </div>
</div>

<!-- ================================ Lobby ================================= -->
<div id="screen-lobby" class="screen hidden">
  <div class="lobby">
    <header>
      <h2><span data-i18n="lobby.title"></span> <span id="lobby-code" class="code"></span></h2>
      <p data-i18n="lobby.share"></p>
    </header>
    <div class="lobby-grid">
      <div class="panel">
        <h3><span data-i18n="lobby.empires"></span> <span id="lobby-count" class="muted"></span></h3>
        <ul id="lobby-players" class="player-list"></ul>
        <div class="row">
          <button id="btn-addbot" data-i18n="lobby.addBot"></button>
          <button id="btn-fill" data-i18n="lobby.fill"></button>
        </div>
      </div>
      <div class="panel">
        <h3 data-i18n="lobby.settings"></h3>
        <label class="field slim"><span data-i18n="menu.board"></span>
          <select id="s-mode">
            <option value="classic" data-i18n="menu.board.classic"></option>
            <option value="space" data-i18n="menu.board.spaceShort"></option>
          </select></label>
        <label class="field slim"><span data-i18n="menu.shape"></span>
          <select id="s-shape">
            <option value="scatter" data-i18n="menu.shape.scatterShort"></option>
            <option value="spiral" data-i18n="menu.shape.spiralShort"></option>
          </select></label>
        <label class="field slim"><span><span data-i18n="lobby.worldsPerPlayer"></span> <b id="v-ppp"></b></span>
          <input type="range" id="s-ppp" min="3" max="14" step="1"></label>
        <label class="field slim"><span><span data-i18n="lobby.startMoney"></span> <b id="v-money"></b></span>
          <input type="range" id="s-money" min="400" max="6000" step="100"></label>
        <label class="field slim"><span><span data-i18n="lobby.startMetal"></span> <b id="v-metal"></b></span>
          <input type="range" id="s-metal" min="100" max="2000" step="50"></label>
        <label class="field slim"><span><span data-i18n="lobby.turnTimer"></span> <b id="v-timer"></b></span>
          <input type="range" id="s-timer" min="0" max="300" step="15"></label>
        <p class="muted small" data-i18n="lobby.timerHint"></p>
        <label class="chk" style="padding:0;margin-top:10px">
          <input type="checkbox" id="s-expand" checked> <span data-i18n="lobby.expand"></span>
        </label>
        <p class="muted small" data-i18n="lobby.expandHint"></p>
      </div>
    </div>
    <div class="lobby-foot">
      <button id="btn-leave" data-i18n="lobby.leave"></button>
      <button id="btn-start" class="primary" data-i18n="lobby.start"></button>
    </div>
    <div id="lobby-error" class="error"></div>
  </div>
</div>

<!-- ================================ Spiel ================================= -->
<div id="screen-game" class="screen hidden">
  <canvas id="map"></canvas>

  <div id="topbar">
    <div class="emblem" id="me-emblem"></div>
    <div class="me">
      <div id="me-name" class="me-name">-</div>
      <div class="me-sub"><span id="me-planets"></span></div>
    </div>
    <div class="res">
      <div class="res-item"><span class="lbl" data-i18n="top.money"></span><span id="r-money" class="val">0</span><span id="r-income" class="delta"></span><span id="r-hold-money" class="hold"></span></div>
      <div class="res-item"><span class="lbl" data-i18n="top.metal"></span><span id="r-metal" class="val">0</span><span id="r-hold-metal" class="hold"></span></div>
    </div>
    <div class="spacer"></div>
    <div class="turnbox">
      <div class="turn"><span data-i18n="top.turn"></span> <span id="r-turn">1</span></div>
      <div id="r-timer" class="timer"></div>
    </div>
    <button id="btn-endturn" class="primary endturn" data-sfx="none" data-i18n="top.endTurn"></button>
  <div id="spectate" class="hidden">
    <button id="sp-play" class="primary" data-sfx="none" data-i18n-attr="title:spectate.pauseTitle" data-i18n="spectate.pause"></button>
    <button id="sp-step" data-sfx="none" data-i18n-attr="title:spectate.stepTitle" data-i18n="spectate.step"></button>
    <span class="sp-speeds">
      <button data-ms="3000" data-sfx="none">½×</button>
      <button data-ms="1500" data-sfx="none" class="active">1×</button>
      <button data-ms="750" data-sfx="none">2×</button>
      <button data-ms="350" data-sfx="none">4×</button>
    </span>
  </div>
  <button id="btn-quit" class="icon-btn quit" data-sfx="none" data-i18n-attr="title:top.quit" data-i18n="top.quitShort"></button>
  </div>

  <div id="leftdock" class="dock">
    <div class="tabs">
      <button data-tab="research" class="active" data-i18n="tab.research"></button>
      <button data-tab="empire" data-i18n="tab.empire"></button>
      <button data-tab="players" data-i18n="tab.players"></button>
    </div>
    <div id="tab-research" class="tabbody"></div>
    <div id="tab-empire" class="tabbody hidden"></div>
    <div id="tab-players" class="tabbody hidden"></div>
  </div>

  <div id="rightdock" class="dock">
    <div id="selection"><p class="muted pad" data-i18n="sel.empty"></p></div>
  </div>

  <div id="logdock" class="dock dlg">
    <div id="log-bar" class="dlg-bar">
      <div class="tabs">
        <button data-ltab="log" class="active" data-i18n="tab.log"></button>
        <button data-ltab="chat" data-i18n="tab.chat"></button>
      </div>
      <span class="spacer"></span>
      <button id="log-collapse" class="icon-btn" data-i18n-attr="title:log.collapseTitle">&minus;</button>
    </div>
    <div id="log-list" class="logbody"></div>
    <div id="chat-list" class="logbody hidden"></div>
    <div id="chat-input-row" class="hidden"><input id="chat-input" data-i18n-attr="placeholder:chat.placeholder" maxlength="200"></div>
    <div id="log-grip" class="dlg-grip" data-i18n-attr="title:log.resizeTitle"></div>
  </div>

  <div id="toasts"></div>
  <!-- Ecke unten rechts: immer sichtbar sind nur Einpassen und Zoom, der Rest
       klappt bei Bedarf darueber auf. -->
  <div id="mapcorner">
    <div id="mapsettings" class="hidden">
      <label class="chk"><input type="checkbox" id="chk-names" checked> <span data-i18n="map.names"></span></label>
      <label class="chk"><input type="checkbox" id="chk-range"> <span data-i18n="map.ranges"></span></label>
      <label class="chk" data-i18n-attr="title:map.territoryTitle"><input type="checkbox" id="chk-terr" checked> <span data-i18n="map.territory"></span></label>
      <label class="chk" data-i18n-attr="title:map.starsTitle"><input type="checkbox" id="chk-stars" checked> <span data-i18n="map.stars"></span></label>
      <label class="chk" data-i18n-attr="title:map.soundTitle"><input type="checkbox" id="chk-sound"> <span data-i18n="map.sound"></span></label>
      <div class="volrow"><span data-i18n="map.volume"></span>
        <input type="range" id="snd-vol" min="0" max="100" step="5" data-i18n-attr="title:map.volume"></div>
      <button id="btn-quit2" class="only-phone" data-sfx="none" data-i18n="top.quit"></button>
    </div>
    <div id="mapcontrols">
      <button id="btn-fit" data-i18n-attr="title:map.fit">&#9678;</button>
      <button id="btn-zoomin" data-i18n-attr="title:map.zoomIn">+</button>
      <button id="btn-zoomout" data-i18n-attr="title:map.zoomOut">&minus;</button>
      <button id="btn-mapopts" data-i18n-attr="title:map.options" aria-expanded="false">&#9881;</button>
    </div>
  </div>

  <!-- Auf dem Telefon gibt es keine schwebenden Docks, sondern eine Leiste
       unten und je ein Blatt, das darueber aufgeht. -->
  <nav id="tabbar" class="only-phone">
    <button data-sheet="" class="active"><span class="ic">&#9678;</span><span data-i18n="nav.map"></span></button>
    <button data-sheet="left"><span class="ic">&#9733;</span><span data-i18n="nav.empire"></span></button>
    <button data-sheet="right"><span class="ic">&#9673;</span><span data-i18n="nav.selection"></span></button>
    <button data-sheet="log"><span class="ic">&#9776;</span><span data-i18n="nav.log"></span></button>
    <button data-sheet="opts"><span class="ic">&#9881;</span><span data-i18n="nav.more"></span></button>
  </nav>

  <div id="turnbanner" class="hidden"></div>
</div>

<!-- ============================ Partie verlassen ========================== -->
<div id="quit" class="modal hidden">
  <div class="modal-box narrow">
    <h2 data-i18n="quit.title"></h2>
    <p class="muted" id="quit-text"></p>
    <div class="row" style="margin-top:18px">
      <button id="quit-yes" class="primary" data-sfx="none" data-i18n="quit.yes"></button>
      <button id="quit-no" data-sfx="none" data-i18n="quit.no"></button>
    </div>
  </div>
</div>

<!-- =============================== Anleitung ============================== -->
<div id="help" class="modal hidden">
  <div class="modal-box">
    <h2 data-i18n="help.title"></h2>
    <div class="help-cols">
      <section>
        <h4 data-i18n="help.goal.h"></h4>
        <p data-i18n-html="help.goal.p"></p>
        <h4 data-i18n="help.worlds.h"></h4>
        <p data-i18n-html="help.worlds.p"></p>
        <h4 data-i18n="help.rings.h"></h4>
        <p data-i18n-html="help.rings.p"></p>
        <h4 data-i18n="help.terra.h"></h4>
        <p data-i18n-html="help.terra.p"></p>
      </section>
      <section>
        <h4 data-i18n="help.research.h"></h4>
        <p data-i18n-html="help.research.p"></p>
        <h4 data-i18n="help.space.h"></h4>
        <p data-i18n-html="help.space.p"></p>
        <h4 data-i18n="help.fleets.h"></h4>
        <p data-i18n-html="help.fleets.p"></p>
        <h4 data-i18n="help.combat.h"></h4>
        <p data-i18n-html="help.combat.p"></p>
      </section>
    </div>
    <button id="help-close" class="primary" data-i18n="help.close"></button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
