<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ho!! – Galactic Expansion</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="img/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
<!-- Added to the home screen, Ho!! starts without browser chrome: Android via
     the manifest, iOS via the apple-* tags (Safari on the iPhone has no
     fullscreen API, so this is the only way there). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05060c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ho!!">
<!-- Preview for shared links (messengers, Mastodon, Slack ...). The image
     lives in the repository and is loaded via an absolute GitHub URL: that
     way it fits every host, and the crawlers need no session. -->
<meta name="description" content="Space strategy in the spirit of Spaceward Ho! – in the browser, for up to 16 players.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ho!!">
<meta property="og:title" content="Ho!! – Galactic Expansion">
<meta property="og:description" content="Space strategy in the spirit of Spaceward Ho! – in the browser, for up to 16 players.">
<meta property="og:image" content="https://raw.githubusercontent.com/db0x/Ho/main/doc/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="Ho!! logo between an ice world and a scorching world above a star map">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

<!-- ============================== Start screen ============================== -->
<div id="screen-menu" class="screen">
  <div class="menu-sky"><canvas id="menu-canvas"></canvas></div>
  <div class="menu-box">
    <h1 class="logo"><img src="img/logo.svg" alt="Ho!!" width="330" height="182"></h1>
    <p class="tagline" data-i18n="menu.tagline"></p>

    <!-- Profile: image and display name. Applies to every game, and with an
         account on every device too. -->
    <div class="field">
      <span data-i18n="menu.name"></span>
      <div class="profile-row">
        <button type="button" id="btn-avatar" class="avatar-pick" data-i18n-attr="title:profile.pick"></button>
        <input id="in-name" maxlength="18" autocomplete="nickname" data-i18n-attr="placeholder:menu.namePlaceholder">
      </div>
      <div class="profile-hint">
        <span id="profile-account" class="muted small"></span>
        <a href="#" id="link-avatar-off" class="small hidden" data-i18n="profile.remove"></a>
      </div>
    </div>

    <label class="field" style="margin-bottom:12px">
      <span data-i18n="menu.board"></span>
      <select id="in-mode">
        <option value="classic" data-i18n="menu.board.classic"></option>
        <option value="space" data-i18n="menu.board.space"></option>
      </select>
    </label>

    <label class="field" style="margin-bottom:12px">
      <span data-i18n="menu.shape"></span>
      <select id="in-shape">
        <option value="scatter" data-i18n="menu.shape.scatter"></option>
        <option value="spiral" data-i18n="menu.shape.spiral"></option>
      </select>
    </label>

    <label class="field" style="margin-bottom:12px">
      <span data-i18n="lobby.maxTurns"></span>
      <select id="in-turns">
        <option value="100" data-i18n="word.turns" data-i18n-args='{"n":100}'></option>
        <option value="200" data-i18n="word.turns" data-i18n-args='{"n":200}'></option>
        <option value="300" data-i18n="word.turns" data-i18n-args='{"n":300}' selected></option>
        <option value="500" data-i18n="word.turns" data-i18n-args='{"n":500}'></option>
        <option value="0" data-i18n="lobby.endless"></option>
      </select>
    </label>

    <div class="menu-actions">
      <button id="btn-create" class="primary" data-i18n="menu.create"></button>
      <button id="btn-solo" data-i18n="menu.solo"></button>
      <div class="join-row">
        <input id="in-code" maxlength="4" data-i18n-attr="placeholder:menu.codePlaceholder" autocomplete="off">
        <button id="btn-join" data-i18n="menu.join"></button>
      </div>
      <div class="join-row">
        <select id="in-watchbots" data-i18n-attr="title:menu.botCountTitle">
          <option value="4" data-i18n="menu.botCount" data-i18n-args='{"n":4}'></option>
          <option value="6" selected data-i18n="menu.botCount" data-i18n-args='{"n":6}'></option>
          <option value="8" data-i18n="menu.botCount" data-i18n-args='{"n":8}'></option>
          <option value="12" data-i18n="menu.botCount" data-i18n-args='{"n":12}'></option>
          <option value="16" data-i18n="menu.botCount" data-i18n-args='{"n":16}'></option>
        </select>
        <button id="btn-watch" data-i18n="menu.watch"></button>
      </div>
    </div>

    <div id="open-games" class="open-games"></div>
    <div id="menu-error" class="error"></div>
    <p class="hint"><span data-i18n="menu.hint"></span><a href="#" id="link-help" data-i18n="menu.help"></a></p>
    <div class="lang-row"><span class="muted small" data-i18n="menu.language"></span>
      <select id="in-lang" class="lang-pick"></select></div>
    <p class="ho-version">Ho!! v__HO_VERSION__ · <a href="https://github.com/db0x/Ho" class="repo-link" target="_blank" rel="noopener" data-i18n="app.repo" data-i18n-attr="title:app.repoTitle"></a></p>
    <p id="account-row" class="account-row hidden">
      <span id="account-name"></span>
      <a href="#" id="link-password" data-i18n="auth.pw.link"></a>
      <a href="#" id="link-logout" data-i18n="auth.logout"></a>
    </p>
  </div>

  <!-- Admins only: every game on this instance and every account. -->
  <section id="admin-panel" class="menu-box admin-box hidden">
    <div class="admin-head">
      <h2 data-i18n="admin.title"></h2>
      <span id="admin-updated" class="muted small"></span>
      <button type="button" id="admin-refresh" class="tiny" data-i18n="admin.refresh"></button>
    </div>
    <h3><span data-i18n="admin.games"></span> <span id="admin-games-count" class="muted"></span></h3>
    <div id="admin-compose" class="admin-compose hidden">
      <div class="ac-head">
        <b id="admin-compose-to"></b>
        <button type="button" id="admin-compose-cancel" class="tiny" data-i18n="admin.msgCancel"></button>
      </div>
      <textarea id="admin-compose-text" rows="3" maxlength="500" data-i18n-attr="placeholder:admin.msgPlaceholder"></textarea>
      <div class="ac-foot">
        <span id="admin-compose-status" class="muted small"></span>
        <button type="button" id="admin-compose-send" class="tiny primary" data-i18n="admin.msgSend"></button>
      </div>
    </div>
    <div id="admin-games" class="admin-list"></div>
    <h3><span data-i18n="admin.invites"></span> <span id="admin-invites-count" class="muted"></span></h3>
    <div class="admin-invite-new">
      <input id="admin-invite-note" maxlength="60" autocomplete="off" data-i18n-attr="placeholder:admin.inviteNote">
      <button type="button" id="admin-invite-create" class="tiny primary" data-i18n="admin.inviteCreate"></button>
    </div>
    <!-- The fresh link: shown once, the server keeps only a hash of it. -->
    <div id="admin-invite-link" class="admin-invite-link hidden">
      <p class="small" data-i18n="admin.inviteOnce"></p>
      <div class="ail-row">
        <input id="admin-invite-url" readonly>
        <button type="button" id="admin-invite-copy" class="tiny" data-i18n="admin.copy"></button>
        <button type="button" id="admin-invite-close" class="tiny" data-i18n="admin.msgCancel"></button>
      </div>
    </div>
    <div id="admin-invites" class="admin-list"></div>
    <h3><span data-i18n="admin.accounts"></span> <span id="admin-accounts-count" class="muted"></span></h3>
    <div id="admin-accounts" class="admin-list"></div>
  </section>
</div>

<!-- ================================ Lobby ================================= -->
<div id="screen-lobby" class="screen hidden">
  <div class="lobby">
    <header>
      <h2><span data-i18n="lobby.title"></span> <span id="lobby-code" class="code"></span></h2>
      <p data-i18n="lobby.share"></p>
    </header>
    <div class="lobby-grid">
      <div class="panel">
        <h3><span data-i18n="lobby.empires"></span> <span id="lobby-count" class="muted"></span></h3>
        <ul id="lobby-players" class="player-list"></ul>
        <div class="row host-only">
          <button id="btn-addbot" data-i18n="lobby.addBot"></button>
          <button id="btn-fill" data-i18n="lobby.fill"></button>
        </div>
      </div>
      <div class="panel" id="lobby-settings">
        <h3 data-i18n="lobby.settings"></h3>
        <!-- Guests only see the settings - that has to be obvious right away. -->
        <p id="settings-lock" class="lock-hint hidden"></p>
        <label class="field slim"><span data-i18n="menu.board"></span>
          <select id="s-mode">
            <option value="classic" data-i18n="menu.board.classic"></option>
            <option value="space" data-i18n="menu.board.spaceShort"></option>
          </select></label>
        <label class="field slim"><span data-i18n="menu.shape"></span>
          <select id="s-shape">
            <option value="scatter" data-i18n="menu.shape.scatterShort"></option>
            <option value="spiral" data-i18n="menu.shape.spiralShort"></option>
          </select></label>
        <label class="field slim"><span data-i18n="lobby.maxTurns"></span>
          <select id="s-turns">
            <option value="100" data-i18n="word.turns" data-i18n-args='{"n":100}'></option>
            <option value="200" data-i18n="word.turns" data-i18n-args='{"n":200}'></option>
            <option value="300" data-i18n="word.turns" data-i18n-args='{"n":300}'></option>
            <option value="500" data-i18n="word.turns" data-i18n-args='{"n":500}'></option>
            <option value="0" data-i18n="lobby.endless"></option>
          </select></label>
        <label class="field slim"><span><span data-i18n="lobby.worldsPerPlayer"></span> <b id="v-ppp"></b></span>
          <input type="range" id="s-ppp" min="3" max="14" step="1"></label>
        <label class="field slim"><span><span data-i18n="lobby.startMoney"></span> <b id="v-money"></b></span>
          <input type="range" id="s-money" min="400" max="6000" step="100"></label>
        <label class="field slim"><span><span data-i18n="lobby.startMetal"></span> <b id="v-metal"></b></span>
          <input type="range" id="s-metal" min="100" max="2000" step="50"></label>
        <label class="field slim"><span><span data-i18n="lobby.turnTimer"></span> <b id="v-timer"></b></span>
          <input type="range" id="s-timer" min="0" max="300" step="15"></label>
        <p class="muted small" data-i18n="lobby.timerHint"></p>
        <label class="chk" style="padding:0;margin-top:10px">
          <input type="checkbox" id="s-expand" checked> <span data-i18n="lobby.expand"></span>
          <b id="v-expand" class="ro-only"></b>
        </label>
        <p class="muted small" data-i18n="lobby.expandHint"></p>
      </div>
    </div>
    <div class="lobby-foot">
      <button id="btn-leave" data-i18n="lobby.leave"></button>
      <button id="btn-start" class="primary" data-i18n="lobby.start"></button>
    </div>
    <div id="lobby-error" class="error"></div>
    <p class="ho-version">Ho!! v__HO_VERSION__ · <a href="https://github.com/db0x/Ho" class="repo-link" target="_blank" rel="noopener" data-i18n="app.repo" data-i18n-attr="title:app.repoTitle"></a></p>
  </div>
</div>

<!-- ================================= Game ================================= -->
<div id="screen-game" class="screen hidden">
  <canvas id="map"></canvas>

  <!-- Three groups: who you are and what you have on the left, the turn in
       the middle, map and menu on the right. -->
  <div id="topbar">
    <div class="tb-left">
      <div class="emblem" id="me-emblem"></div>
      <div class="me">
        <div id="me-name" class="me-name">-</div>
        <div class="me-sub"><span id="me-planets"></span></div>
      </div>
      <!-- Balance now -> after the end of the turn; broken down in the ledger. -->
      <div class="res" id="res">
        <button type="button" class="res-item" data-sfx="none" aria-controls="ledger" aria-expanded="false" data-i18n-attr="title:ledger.open">
          <span class="lbl" data-i18n="top.money"></span><span id="r-money" class="val">0</span><span id="r-money-next" class="next"></span></button>
        <button type="button" class="res-item" data-sfx="none" aria-controls="ledger" aria-expanded="false" data-i18n-attr="title:ledger.open">
          <span class="lbl" data-i18n="top.metal"></span><span id="r-metal" class="val">0</span><span id="r-metal-next" class="next"></span></button>
        <div id="ledger" class="ledger hidden" role="dialog" aria-labelledby="ledger-title"></div>
      </div>
    </div>

    <div class="tb-center">
      <div class="turnbox">
        <div class="turn"><span data-i18n="top.turn"></span> <span id="r-turn">1</span></div>
        <div id="r-timer" class="timer"></div>
      </div>
      <button id="btn-endturn" class="primary endturn" data-sfx="none" data-i18n="top.endTurn"></button>
      <div id="spectate" class="hidden">
        <button id="sp-play" class="primary" data-sfx="none" data-i18n-attr="title:spectate.pauseTitle" data-i18n="spectate.pause"></button>
        <button id="sp-step" data-sfx="none" data-i18n-attr="title:spectate.stepTitle" data-i18n="spectate.step"></button>
        <span class="sp-speeds">
          <button data-ms="3000" data-sfx="none">½×</button>
          <button data-ms="1500" data-sfx="none" class="active">1×</button>
          <button data-ms="750" data-sfx="none">2×</button>
          <button data-ms="350" data-sfx="none">4×</button>
        </span>
      </div>
      <!-- Host only: holds the game for everyone. -->
      <button id="btn-pause" class="pause hidden" data-sfx="none" aria-pressed="false"><span class="ic"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3.5h2.4v9H4.5zM9.1 3.5h2.4v9H9.1z" fill="currentColor"/></svg></span><span class="lbl"></span></button>
    </div>

    <div class="tb-right">
      <!-- Minimized windows wait here as icons; a click brings them back. -->
      <div id="tray">
        <button type="button" id="tray-left" class="tray-btn hidden" data-sfx="none" data-i18n-attr="title:dock.restoreLeft"><span class="ic"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8.00,1.80 9.65,6.13 14.28,6.36 10.66,9.27 11.88,13.74 8.00,11.20 4.12,13.74 5.34,9.27 1.72,6.36 6.35,6.13" fill="currentColor"/></svg></span><span class="lbl" data-i18n="dock.trayLeft"></span></button>
        <button type="button" id="tray-log" class="tray-btn hidden" data-sfx="none" data-i18n-attr="title:dock.restoreLog"><span class="ic"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="lbl" data-i18n="dock.trayLog"></span><span class="badge chat-badge hidden"></span></button>
      </div>
      <!-- Fit and zoom always at hand; the gear opens the menu: language,
           display, sound and leaving the game. On a phone the buttons sit at
           the bottom right and the menu is a sheet (stylesheet). -->
      <div id="mapcorner">
        <div id="mapcontrols">
          <button id="btn-fit" data-i18n-attr="title:map.fit"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg></button>
          <button id="btn-zoomin" data-i18n-attr="title:map.zoomIn"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
          <button id="btn-zoomout" data-i18n-attr="title:map.zoomOut"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
          <button id="btn-mapopts" data-i18n-attr="title:map.options" aria-expanded="false" aria-haspopup="true"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12.60 8.00L15.20 8.00 M11.25 11.25L13.09 13.09 M8.00 12.60L8.00 15.20 M4.75 11.25L2.91 13.09 M3.40 8.00L0.80 8.00 M4.75 4.75L2.91 2.91 M8.00 3.40L8.00 0.80 M11.25 4.75L13.09 2.91" stroke="currentColor" stroke-width="2.6" stroke-linecap="butt"/></svg></button>
        </div>
        <div id="mapsettings" class="hidden">
          <label class="langrow"><span data-i18n="menu.language"></span>
            <select id="in-lang-game" class="lang-pick"></select></label>
          <label class="chk"><input type="checkbox" id="chk-names" checked> <span data-i18n="map.names"></span></label>
          <label class="chk"><input type="checkbox" id="chk-range"> <span data-i18n="map.ranges"></span></label>
          <label class="chk" data-i18n-attr="title:map.territoryTitle"><input type="checkbox" id="chk-terr" checked> <span data-i18n="map.territory"></span></label>
          <label class="chk" data-i18n-attr="title:map.starsTitle"><input type="checkbox" id="chk-stars" checked> <span data-i18n="map.stars"></span></label>
          <label class="chk hidden" id="row-fullscreen" data-i18n-attr="title:map.fullscreenTitle"><input type="checkbox" id="chk-fullscreen"> <span data-i18n="map.fullscreen"></span></label>
          <label class="chk" data-i18n-attr="title:map.soundTitle"><input type="checkbox" id="chk-sound"> <span data-i18n="map.sound"></span></label>
          <div class="volrow"><span data-i18n="map.volume"></span>
            <input type="range" id="snd-vol" min="0" max="100" step="5" data-i18n-attr="title:map.volume"></div>
          <button id="btn-quit" class="menu-quit" data-sfx="none" data-i18n="top.quit"></button>
          <div class="ho-version">Ho!! v__HO_VERSION__</div>
        </div>
      </div>
    </div>
  </div>

  <div id="leftdock" class="dock dlg">
    <div id="left-bar" class="dlg-bar" data-i18n-attr="title:dock.moveTitle">
      <div class="tabs">
        <button data-tab="research" class="active" data-i18n="tab.research"></button>
        <button data-tab="empire" data-i18n="tab.empire"></button>
        <button data-tab="players" data-i18n="tab.players"></button>
      </div>
      <span class="spacer"></span>
      <button id="left-collapse" class="icon-btn" data-i18n-attr="title:log.collapseTitle" aria-expanded="true">&minus;</button>
    </div>
    <div id="tab-research" class="tabbody"></div>
    <div id="tab-empire" class="tabbody hidden"></div>
    <div id="tab-players" class="tabbody hidden"></div>
    <div id="left-grip" class="dlg-grip" data-i18n-attr="title:log.resizeTitle"></div>
  </div>

  <div id="rightdock" class="dock">
    <div id="selection"><p class="muted pad" data-i18n="sel.empty"></p></div>
  </div>

  <div id="logdock" class="dock dlg">
    <div id="log-bar" class="dlg-bar">
      <div class="tabs">
        <button data-ltab="log" class="active" data-i18n="tab.log"></button>
        <button data-ltab="chat"><span data-i18n="tab.chat"></span><span class="badge chat-badge hidden"></span></button>
      </div>
      <span class="spacer"></span>
      <button id="log-collapse" class="icon-btn" data-i18n-attr="title:log.collapseTitle" aria-expanded="true">&minus;</button>
    </div>
    <div id="log-list" class="logbody"></div>
    <div id="chat-list" class="logbody hidden"></div>
    <div id="chat-input-row" class="hidden"><input id="chat-input" data-i18n-attr="placeholder:chat.placeholder" maxlength="200"></div>
    <div id="log-grip" class="dlg-grip" data-i18n-attr="title:log.resizeTitle"></div>
  </div>

  <!-- The pause notice sits at the top of the message column: toasts line up beneath it. -->
  <div id="toasts"><div id="pausebar" class="hidden" role="status"></div></div>
  <!-- On a phone there are no floating docks, but a bar at the bottom and
       one sheet each that opens above it. -->
  <nav id="tabbar" class="only-phone">
    <button data-sheet="" class="active"><span class="ic">&#9678;</span><span data-i18n="nav.map"></span></button>
    <button data-sheet="left"><span class="ic">&#9733;</span><span data-i18n="nav.empire"></span></button>
    <button data-sheet="right"><span class="ic">&#9673;</span><span data-i18n="nav.selection"></span></button>
    <button data-sheet="log"><span class="ic">&#9776;</span><span data-i18n="nav.log"></span><span class="badge chat-badge hidden"></span></button>
    <button data-sheet="opts"><span class="ic">&#9881;</span><span data-i18n="nav.more"></span></button>
  </nav>

  <div id="turnbanner" class="hidden"></div>
</div>

<!-- =============================== Leave game ============================= -->
<div id="quit" class="modal hidden">
  <div class="modal-box narrow">
    <h2 id="quit-title" data-i18n="quit.title"></h2>
    <p class="muted" id="quit-text"></p>
    <div class="row" style="margin-top:18px">
      <button id="quit-yes" class="primary" data-sfx="none" data-i18n="quit.yes"></button>
      <button id="quit-no" data-sfx="none" data-i18n="quit.no"></button>
    </div>
  </div>
</div>

<!-- ============================ Change password =========================== -->
<div id="pwchange" class="modal hidden">
  <div class="modal-box narrow">
    <h2 data-i18n="auth.pw.title"></h2>
    <form id="pw-form">
      <p class="muted small" id="pw-intro"></p>
      <!-- The account name helps password managers file the new password. -->
      <input type="text" id="pw-user" autocomplete="username" class="hidden" tabindex="-1" aria-hidden="true">
      <label class="field">
        <span data-i18n="auth.change.current"></span>
        <input id="pw-old" type="password" autocomplete="current-password" maxlength="200">
      </label>
      <label class="field">
        <span data-i18n="auth.change.new"></span>
        <input id="pw-new" type="password" autocomplete="new-password" maxlength="200">
      </label>
      <label class="field">
        <span data-i18n="auth.change.repeat"></span>
        <input id="pw-new2" type="password" autocomplete="new-password" maxlength="200">
      </label>
      <div id="pw-error" class="error"></div>
      <div class="row" style="margin-top:10px">
        <button id="pw-save" class="primary" type="submit" data-i18n="auth.pw.save"></button>
        <button id="pw-cancel" type="button" data-i18n="auth.pw.cancel"></button>
      </div>
    </form>
    <div id="pw-done" class="hidden">
      <p class="pw-ok" data-i18n="auth.pw.done"></p>
      <p class="muted small" data-i18n="auth.pw.doneHint"></p>
      <button id="pw-ok" class="primary" type="button" data-i18n="auth.pw.ok"></button>
    </div>
  </div>
</div>
