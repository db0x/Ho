<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ho!!</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="img/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/mark.svg">
<!-- Preview for shared links (messengers, Mastodon, Slack ...). The image
     lives in the repository and is loaded via an absolute GitHub URL: that
     way it fits every host, and the crawlers need no session. -->
<meta name="description" content="Space strategy in the spirit of Spaceward Ho! – in the browser, for up to 16 players.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ho!!">
<meta property="og:title" content="Ho!! – Galactic Expansion">
<meta property="og:description" content="Space strategy in the spirit of Spaceward Ho! – in the browser, for up to 16 players.">
<meta property="og:image" content="https://raw.githubusercontent.com/db0x/Ho/main/doc/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="Ho!! logo between an ice world and a scorching world above a star map">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

<!-- In front of the lobby: without a session the server does not hand out
     the game client, but it does hand out this page. That is why it only
     needs the stylesheet, the language catalogs, the starry sky and itself. -->
<div id="screen-login" class="screen">
  <div class="menu-sky"><canvas id="login-canvas"></canvas></div>
  <div class="menu-box">
    <h1 class="logo"><img src="img/logo.svg" alt="Ho!!" width="330" height="182"></h1>

    <form id="form-login" class="hidden">
      <p class="tagline" data-i18n="auth.intro"></p>
      <label class="field">
        <span data-i18n="auth.user"></span>
        <input id="in-user" name="username" autocomplete="username" autocapitalize="none"
               spellcheck="false" maxlength="24" data-i18n-attr="placeholder:auth.userPlaceholder">
      </label>
      <label class="field">
        <span data-i18n="auth.password"></span>
        <input id="in-pass" name="password" type="password" autocomplete="current-password" maxlength="200">
      </label>
      <button class="primary wide" type="submit" data-i18n="auth.login"></button>
    </form>

    <form id="form-change" class="hidden">
      <h2 data-i18n="auth.change.title"></h2>
      <p class="tagline" id="change-intro"></p>
      <label class="field">
        <span data-i18n="auth.change.current"></span>
        <input id="in-old" type="password" autocomplete="current-password" maxlength="200">
      </label>
      <label class="field">
        <span data-i18n="auth.change.new"></span>
        <input id="in-new" type="password" autocomplete="new-password" maxlength="200">
      </label>
      <label class="field">
        <span data-i18n="auth.change.repeat"></span>
        <input id="in-new2" type="password" autocomplete="new-password" maxlength="200">
      </label>
      <button class="primary wide" type="submit" data-i18n="auth.change.save"></button>
    </form>

    <!-- Invite link: the new player picks name and password themselves. -->
    <form id="form-invite" class="hidden">
      <h2 data-i18n="auth.invite.title"></h2>
      <p class="tagline" id="invite-intro"></p>
      <blockquote id="invite-note" class="invite-note hidden"></blockquote>
      <label class="field">
        <span data-i18n="auth.invite.user"></span>
        <input id="in-inv-user" name="username" autocomplete="username" autocapitalize="none"
               spellcheck="false" maxlength="24" data-i18n-attr="placeholder:auth.userPlaceholder">
      </label>
      <p class="small muted invite-hint" data-i18n="auth.invite.userHint"></p>
      <label class="field">
        <span data-i18n="auth.invite.password"></span>
        <input id="in-inv-pass" type="password" autocomplete="new-password" maxlength="200">
      </label>
      <label class="field">
        <span data-i18n="auth.invite.repeat"></span>
        <input id="in-inv-pass2" type="password" autocomplete="new-password" maxlength="200">
      </label>
      <button class="primary wide" type="submit" data-i18n="auth.invite.submit"></button>
    </form>


    <div id="login-error" class="error"></div>

    <div class="lang-row"><span class="muted small" data-i18n="menu.language"></span>
      <select id="in-lang"></select></div>
    <p class="ho-version">Ho!! v__HO_VERSION__ · <a href="https://github.com/db0x/Ho" class="repo-link" target="_blank" rel="noopener" data-i18n="app.repo" data-i18n-attr="title:app.repoTitle"></a></p>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
