<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" version="1.1">
 <!-- Ho!! app icon in the style of the Papirus icon theme: flat colors, a
      1px drop shadow under every shape (opacity .2) and a faint light edge
      on top. The motif is the wordmark: the earth-like world and the brass "!!". -->
 <defs>
  <clipPath id="world">
   <circle cx="25" cy="33" r="16"/>
  </clipPath>
 </defs>
 <!-- Base: deep space -->
 <rect style="opacity:0.2" width="56" height="56" x="4" y="5" rx="2.8" ry="2.8"/>
 <rect style="fill:#2e3558" width="56" height="56" x="4" y="4" rx="2.8" ry="2.8"/>
 <!-- Stars -->
 <circle style="fill:#ffffff;opacity:0.7" cx="12" cy="12" r="1"/>
 <circle style="fill:#ffffff;opacity:0.5" cx="36" cy="10" r="0.8"/>
 <circle style="fill:#ffffff;opacity:0.6" cx="53" cy="12" r="1"/>
 <circle style="fill:#ffffff;opacity:0.4" cx="9" cy="53" r="0.8"/>
 <circle style="fill:#ffffff;opacity:0.5" cx="44" cy="55" r="0.8"/>
 <!-- The world -->
 <circle style="opacity:0.2" cx="25" cy="34" r="16"/>
 <circle style="fill:#2a72c4" cx="25" cy="33" r="16"/>
 <g clip-path="url(#world)">
  <path style="fill:#4fb267" d="M 9,29 12,23 18,20 23,22 27,19 32,22 31,27 26,29 23,33 16,35 11,34 Z"/>
  <path style="fill:#4fb267" d="M 23,45 27,41 34,40 40,43 41,49 36,52 27,51 Z"/>
  <path style="fill:#4fb267" d="M 35,26 39,24 42,27 41,31 37,32 Z"/>
  <path style="fill:#3b8e51" d="M 14,27 19,24 23,26 21,30 16,30 Z"/>
  <circle style="fill:#4fb267" cx="13" cy="41" r="2"/>
  <!-- Polar cap -->
  <ellipse style="fill:#f4faff;opacity:0.85" cx="25" cy="17.5" rx="8" ry="3"/>
  <!-- Night side -->
  <path style="opacity:0.2" d="M 25,17 A 16,16 0 0 1 41,33 16,16 0 0 1 25,49 16,16 0 0 1 14.5,45.1 14,14 0 0 0 23,47 14,14 0 0 0 37,33 14,14 0 0 0 31,21.6 16,16 0 0 0 25,17 Z"/>
 </g>
 <!-- Light edge of the atmosphere -->
 <path style="opacity:0.2;fill:#ffffff" d="M 25,17 A 16,16 0 0 0 9,33 16,16 0 0 0 9.02,33.5 16,16 0 0 1 25,18 16,16 0 0 1 40.98,33.5 16,16 0 0 0 41,33 16,16 0 0 0 25,17 Z"/>
 <!-- "!!" in brass - edges on even coordinates, so they stay sharp at 32px too -->
 <rect style="opacity:0.2" width="4" height="20" x="46" y="19" rx="2" ry="2"/>
 <rect style="opacity:0.2" width="4" height="20" x="52" y="19" rx="2" ry="2"/>
 <rect style="opacity:0.2" width="4" height="4" x="46" y="43" rx="2" ry="2"/>
 <rect style="opacity:0.2" width="4" height="4" x="52" y="43" rx="2" ry="2"/>
 <rect style="fill:#f0b429" width="4" height="20" x="46" y="18" rx="2" ry="2"/>
 <rect style="fill:#f0b429" width="4" height="20" x="52" y="18" rx="2" ry="2"/>
 <rect style="fill:#f0b429" width="4" height="4" x="46" y="42" rx="2" ry="2"/>
 <rect style="fill:#f0b429" width="4" height="4" x="52" y="42" rx="2" ry="2"/>
 <rect style="fill:#ffffff;opacity:0.2" width="4" height="1" x="46" y="18" rx="0.5" ry="0.5"/>
 <rect style="fill:#ffffff;opacity:0.2" width="4" height="1" x="52" y="18" rx="0.5" ry="0.5"/>
 <!-- Light edge on top of the base -->
 <path style="opacity:0.1;fill:#ffffff" d="M 6.8,4 C 5.25,4 4,5.25 4,6.8 V 7.8 C 4,6.25 5.25,5 6.8,5 H 57.2 C 58.75,5 60,6.25 60,7.8 V 6.8 C 60,5.25 58.75,4 57.2,4 Z"/>
</svg>
