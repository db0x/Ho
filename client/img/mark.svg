<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Ho!!">
  <title>Ho!!</title>
  <desc>The earth-like world from the Ho!! wordmark</desc>
  <defs>
    <!-- At 16 pixels contrast is what counts: richer blue, stronger green,
         and only as much coastline as can still be told apart there. -->
    <radialGradient id="o" cx="0.34" cy="0.3" r="0.86">
      <stop offset="0" stop-color="#4f9fe0"/>
      <stop offset="0.42" stop-color="#2064b2"/>
      <stop offset="0.78" stop-color="#133a74"/>
      <stop offset="1" stop-color="#0a2550"/>
    </radialGradient>
    <radialGradient id="n" cx="0.32" cy="0.28" r="0.8">
      <stop offset="0.42" stop-color="#02060f" stop-opacity="0"/>
      <stop offset="1" stop-color="#02060f" stop-opacity="0.72"/>
    </radialGradient>
    <radialGradient id="kappe" cx="0.5" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#f4faff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#eef7ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="k"><circle cx="32" cy="32" r="26"/></clipPath>
  </defs>

  <circle cx="32" cy="32" r="26" fill="url(#o)"/>
  <g clip-path="url(#k)">
    <!-- Shelf -->
    <g fill="#3f93dd" opacity="0.4" transform="translate(32 32) scale(1.08) translate(-32 -32)">
      <path d="M12 28 L15 22 L21 19 L27 21 L31 18 L36 21 L35 27 L30 29 L27 33 L20 35 L14 33 Z"/>
      <path d="M30 46 L34 41 L41 39 L47 42 L49 47 L45 52 L37 54 L31 51 Z"/>
    </g>
    <!-- Land masses -->
    <path fill="#4fb267" d="M12 28 L15 22 L21 19 L27 21 L31 18 L36 21 L35 27 L30 29 L27 33 L20 35 L14 33 Z"/>
    <path fill="#4aad62" d="M30 46 L34 41 L41 39 L47 42 L49 47 L45 52 L37 54 L31 51 Z"/>
    <path fill="#45a25c" d="M44 23 L49 20 L54 23 L53 28 L47 30 L43 27 Z"/>
    <!-- Highlands, so the green does not look flat -->
    <path fill="#3b8e51" d="M18 26 L23 23 L28 25 L26 29 L20 30 Z"/>
    <ellipse cx="24" cy="24" rx="2" ry="1.4" fill="#1f5ba6" opacity="0.85"/>
    <!-- Islands -->
    <circle cx="16" cy="42" r="2.4" fill="#4fb267"/>
    <circle cx="52" cy="38" r="1.8" fill="#4aad62"/>
    <circle cx="23" cy="48" r="1.5" fill="#4aad62"/>
    <!-- Polar caps -->
    <ellipse cx="32" cy="8" rx="13" ry="5" fill="url(#kappe)"/>
    <ellipse cx="33" cy="57" rx="11" ry="4.5" fill="url(#kappe)" opacity="0.7"/>
    <!-- Cloud and night side -->
    <ellipse cx="38" cy="34" rx="11" ry="3" fill="#ffffff" opacity="0.16" transform="rotate(8 38 34)"/>
    <circle cx="32" cy="32" r="26" fill="url(#n)"/>
  </g>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#9cc8f0" stroke-opacity="0.25" stroke-width="1"/>
</svg>
