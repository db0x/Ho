name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nur lesen - der Workflow braucht keine Schreibrechte am Repo.
permissions:
  contents: read

# Bei schneller Folge von Pushes laeuft nur der neueste Stand weiter.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Ein Ausfall auf einer Version soll die anderen nicht abwuergen -
      # so ist sofort sichtbar, ob es alle Versionen trifft oder nur eine.
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci statt npm install: installiert genau den Stand aus
      # package-lock.json und bricht ab, wenn Lock und package.json
      # auseinanderlaufen.
      - run: npm ci

      # i18n-Kataloge, Spiel-Engine, schwarzes Loch, Mehrspieler-Netzcode.
      # Der Netztest startet den echten Server auf einem Zufallsport.
      - run: npm test
