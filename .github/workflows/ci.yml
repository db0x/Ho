name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read only - the workflow needs no write access to the repo.
permissions:
  contents: read

# When pushes follow in quick succession, only the latest one keeps running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # A failure on one version should not cancel the others - that way it
      # is obvious right away whether all versions are affected or just one.
      fail-fast: false
      matrix:
        node: ['22', '24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci instead of npm install: installs exactly what package-lock.json
      # says and fails if the lock file and package.json drift apart.
      - run: npm ci

      # i18n catalogs, game engine, black hole, multiplayer network code.
      # The network test starts the real server on a random port.
      - run: npm test
